name: Verify Relay

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      RELAY_E2E_PORT: "18000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.8"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: uv sync --locked --python 3.11
      - name: Bash launcher checks
        if: runner.os == 'Linux'
        run: bash scripts/tests/test-launchers.sh
      - name: Backend and Lab tests
        run: uv run --locked pytest backend/tests lab/tests -q
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Main browser workflows
        working-directory: frontend
        run: npm run test:e2e
      - name: Lab browser workflows
        working-directory: frontend
        run: npx playwright test --config playwright.lab.config.ts
      - name: Synthetic demo walkthrough
        working-directory: frontend
        run: npx playwright test --config playwright.demo.config.ts
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.os }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
