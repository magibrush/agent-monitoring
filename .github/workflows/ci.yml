name: Verify Relay

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RELAY_E2E_PORT: "18000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.8"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: uv sync --locked --python 3.11
      - name: Backend and Lab tests
        run: uv run --locked pytest backend/tests lab/tests -q
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install chromium
      - name: Main browser workflows
        working-directory: frontend
        run: npm run test:e2e
      - name: Lab browser workflows
        working-directory: frontend
        run: npx playwright test --config playwright.lab.config.ts
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
